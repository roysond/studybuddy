ontainer handles actually creating the real database service and handing it over.\n\nWhy does this matter? Two big wins. First, testing becomes so much easier \u2014 you can pass in a fake database instead of the real one, so your tests run fast and don\u0027t touch the actual database. Second, your class stays focused on its own job and doesn\u0027t get tangled up with the messy details of how to build all its dependencies. That separation is really powerful.\n\nDoes that make sense? Do you want to dig into how constructor injection specifically works, or talk about how the DI container fits in?&quot;}]}]},&quot;evaluationResult&quot;:{&quot;metrics&quot;:{&quot;Relevance (RTC)&quot;:{&quot;$type&quot;:&quot;numeric&quot;,&quot;value&quot;:5,&quot;name&quot;:&quot;Relevance (RTC)&quot;,&quot;reason&quot;:&quot;100% of the response is 100% related to the request&quot;,&quot;interpretation&quot;:{&quot;rating&quot;:&quot;exceptional&quot;,&quot;failed&quot;:false},&quot;metadata&quot;:{&quot;built-in-eval&quot;:&quot;True&quot;,&quot;eval-model&quot;:&quot;anthropic/claude-haiku-4.5&quot;,&quot;eval-input-tokens&quot;:&quot;3247&quot;,&quot;eval-output-tokens&quot;:&quot;197&quot;,&quot;eval-total-tokens&quot;:&quot;3444&quot;,&quot;eval-duration-ms&quot;:&quot;2964.62&quot;}},&quot;Truth (RTC)&quot;:{&quot;$type&quot;:&quot;numeric&quot;,&quot;value&quot;:5,&quot;name&quot;:&quot;Truth (RTC)&quot;,&quot;reason&quot;:&quot;100% of the response is 100% true&quot;,&quot;interpretation&quot;:{&quot;rating&quot;:&quot;exceptional&quot;,&quot;failed&quot;:false},&quot;metadata&quot;:{&quot;built-in-eval&quot;:&quot;True&quot;,&quot;eval-model&quot;:&quot;anthropic/claude-haiku-4.5&quot;,&quot;eval-input-tokens&quot;:&quot;3247&quot;,&quot;eval-output-tokens&quot;:&quot;197&quot;,&quot;eval-total-tokens&quot;:&quot;3444&quot;,&quot;eval-duration-ms&quot;:&quot;2964.62&quot;}},&quot;Completeness (RTC)&quot;:{&quot;$type&quot;:&quot;numeric&quot;,&quot;value&quot;:4,&quot;na echnique for applying DIP: instead of a class constructing its own dependencies, those dependencies are provided from the outside (constructor injection is the most common form).&quot;}]}],&quot;modelResponse&quot;:{&quot;messages&quot;:[{&quot;role&quot;:&quot;assistant&quot;,&quot;contents&quot;:[{&quot;$type&quot;:&quot;text&quot;,&quot;text&quot;:&quot;Okay, so the Open/Closed Principle is actually pretty intuitive once you get the idea behind it.\n\nThink of it this way: imagine you have a working piece of code\u2014like a class that does its job really well. The principle says you should be able to *add new features* to your system without going back and *changing that code*. You want it closed to modification but open to extension.\n\nHere\u0027s a concrete picture. Say you have a \u0060PaymentProcessor\u0060 class that handles credit card payments. It works great. Then one day your boss says, \u0022We need to also accept PayPal now.\u0022 \n\nThe *wrong* way? You\u0027d open up that \u0060PaymentProcessor\u0060 class and jam in a bunch of new logic: \u0022If it\u0027s PayPal, do this. If it\u0027s credit card, do that.\u0022 Now you\u0027re modifying existing code. You risk breaking something. You have to test everything again.\n\nThe *right* way? You leave \u0060PaymentProcessor\u0060 alone. Instead, you create new classes\u2014maybe \u0060CreditCardPayment\u0060 and \u0060PayPalPayment\u0060\u2014that each know how to handle their own type of payment. They follow the same contract or interface. Your system grows by *adding new types*, not by rewriting old ones.\n\nWhy does this matter? Because the more you poke around in working code, the more likely you\u0027ll introduce bugs. And if lots of other parts of your system depend on that code, changes get risky fast.\n\nSo the principle is really about designing things so that new features slot in smoothly, like LEGO blocks, rather than requiring surgery on what\u0027s already there.\n\nDoes that click?&quot;} Count&quot;:0,&quot;OutputTokenDetails.AcceptedPredictionTokenCount&quot;:0,&quot;OutputTokenDetails.RejectedPredictionTokenCount&quot;:0}},&quot;cacheKey&quot;:&quot;ED883AB3ABF7011358AC2389F5F6DFDCD00444580C21F772721532C83E67DDBD01399CF931D3DB1204199173EFDA219C&quot;,&quot;cacheHit&quot;:false}]},&quot;formatVersion&quot;:1},{&quot;scenarioName&quot;:&quot;Explain-SRP&quot;,&quot;iterationName&quot;:&quot;1&quot;,&quot;executionName&quot;:&quot;20260730T152610Z&quot;,&quot;creationTime&quot;:&quot;2026-07-30T15:26:17.294525Z&quot;,&quot;messages&quot;:[{&quot;role&quot;:&quot;user&quot;,&quot;contents&quot;:[{&quot;$type&quot;:&quot;text&quot;,&quot;text&quot;:&quot;Explain this study material.\n\nFocus: What is the Single Responsibility Principle?\n\nStudy material:\nSOLID is a set of five design principles that make object-oriented software easier to maintain and extend.\n\nSingle Responsibility Principle (SRP): A class should have only one reason to change. Each class owns a single concern so changes stay local.\n\nOpen/Closed Principle (OCP): Software entities should be open for extension but closed for modification. Prefer adding new behaviour through new types rather than editing existing ones.\n\nLiskov Substitution Principle (LSP): Subtypes must be substitutable for their base types without breaking callers. A derived class must honour the contracts of its parent.\n\nInterface Segregation Principle (ISP): Clients should not be forced to depend on methods they do not use. Prefer small, focused interfaces over large ones.\n\nDependency Inversion Principle (DIP): High-level modules should not depend on low-level modules; both should depend on abstractions. Depend on interfaces, not concrete implementations.\n\nDependency injection is a practical technique for applying DIP: instead of a class constructing its own dependencies, those dependencies are provided from the outside (constructor injection is the most common form).&quot;}]}],&quot;modelResponse&quot;:{&quot;messages&quot;:[{&quot;role&quot;:&quot;assistant&quot;,&quot;contents&quot;:[{&quot;$type&quot;:&quot;text&quot;,&quot;text&quot;:&quot;Great question! So the Single Responsibility Principle is really about keeping things focused.\n\nHere\u0027s the core idea: **each class should have just one reason to change**. What does that mean? Well, think of a reason to change as a reason to modify the code\u2014like if your boss comes to you and says \u0022we need to fix how we do X\u0022 or \u0022we need to add support for Y.\u0022\n\nIf a class has only one responsibility, then it only has one reason to change. Everything that would make you rewrite it all flows from that one concern.\n\nLet me give you a real-world feel for this. Imagine you have a class that both saves a user to the database *and* sends them a welcome email. Now you have two reasons to change that class: either the database logic needs to change, or the email logic needs to change. That\u0027s messy because the two concerns are tangled together.\n\nInstead, you\u0027d want one class just for handling the database part, and a separate class just for handling emails. Now each one has a single reason to change, and they\u0027re independent. If email breaks, it doesn\u0027t touch your database code.\n\nThe benefit? Your code becomes easier to maintain, easier to test, and easier to modify later. Changes stay local and don\u0027t ripple through everything.\n\nDoes that make sense? Want to talk through an example?&quot;}]}]},&quot;evaluationResult&quot;:{&quot;metrics&quot;:{&quot;Relevance (RTC)&quot;:{&quot;$type&quot;:&quot;numeric&quot;,&quot;value&quot;:5,&quot;name&quot;:&quot;Relevance (RTC)&quot;,&quot;reason&quot;:&quot;100% of the response is 100% related to the request&quot;,&quot;interpretation&quot;:{&quot;rating&quot;:&quot;exceptional&quot;,&quot;failed&quot;:false},&quot;metadata&quot;:{&quot;built-in-eval&quot;:&quot;True&quot;,&quot;eval-model&quot;:&quot;anthropic/claude-haiku-4.5&quo
